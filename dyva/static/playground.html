<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111;color:#eee;padding:20px;max-width:900px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.header h1{font-size:1.5rem}
.header .sub{color:#999;font-size:.85rem}
.header a{font-size:.82rem;color:#77a;text-decoration:none;margin-left:12px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{padding:8px 18px;border:none;border-radius:6px;background:#1e1e1e;color:#999;font-size:.9rem;cursor:pointer}
.tab.active{background:#2a2a4a;color:#eee}
.panel{display:none}
.panel.active{display:block}
label{display:block;font-size:.8rem;color:#999;margin-bottom:6px}
input[type=text],input[type=number],textarea,select{width:100%;padding:8px 10px;border:1px solid #444;border-radius:6px;background:#2a2a2a;color:#eee;font-size:.85rem;outline:none;font-family:ui-monospace,monospace}
input[type=text]:focus,input[type=number]:focus,textarea:focus,select:focus{border-color:#888}
textarea{resize:vertical;min-height:64px}
button{background:#3a3a5a;color:#eee;border:none;border-radius:6px;padding:10px 20px;font-size:.9rem;cursor:pointer}
button:hover{background:#4a4a7a}
button:disabled{opacity:.5;cursor:default}
.model-row{margin-bottom:12px}
.messages{border:1px solid #333;border-radius:8px;background:#181818;height:46vh;overflow-y:auto;padding:12px;margin-bottom:12px}
.msg{margin-bottom:12px}
.msg .role{font-size:.72rem;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.msg.user .role{color:#77a}
.msg .body{background:#1e1e1e;border-radius:8px;padding:10px;font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.msg .body .error{color:#c33}
.msg.user .body{background:#222a3a}
.msg.assistant .body pre{background:#111;border:1px solid #333;border-radius:6px;padding:8px;overflow-x:auto;white-space:pre;margin:6px 0}
.msg.assistant .body code{font-family:ui-monospace,monospace;font-size:.82rem;background:#111;padding:1px 4px;border-radius:4px}
.msg.assistant .body pre code{background:none;padding:0}
.msg.assistant .body a{color:#77a}
.msg.assistant .body blockquote{border-left:3px solid #444;margin:6px 0;padding:2px 10px;color:#aaa}
.msg.assistant .body table{border-collapse:collapse;margin:6px 0}
.msg.assistant .body th,.msg.assistant .body td{border:1px solid #444;padding:4px 8px}
.msg.assistant .body ul,.msg.assistant .body ol{margin:0;padding-left:22px}
.msg.assistant .body li{margin:1px 0}
.msg.assistant .body p{margin:2px 0}
.msg.assistant .body h1,.msg.assistant .body h2,.msg.assistant .body h3,.msg.assistant .body h4{margin:8px 0 4px}
.msg.assistant .body hr{border:none;border-top:1px solid #444;margin:8px 0}
.input-row{display:flex;gap:8px}
.input-row textarea{flex:1;min-height:64px}
.input-row button{align-self:flex-end}
.chat-top{display:flex;gap:8px;margin-bottom:12px}
.chat-top select{flex:1}
.chat-top button{padding:8px 14px}
.chat-layout{display:flex;gap:12px;height:70vh}
.chat-sidebar{width:220px;flex-shrink:0;border:1px solid #333;border-radius:8px;background:#181818;display:flex;flex-direction:column;overflow:hidden}
.sidebar-new{margin:10px;flex-shrink:0}
.chat-list{flex:1;overflow-y:auto;padding:0 6px 10px}
.chat-item{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px;border-radius:6px;cursor:pointer;font-size:.8rem;color:#ccc}
.chat-item:hover{background:#2a2a3a}
.chat-item.active{background:#2a2a4a}
.chat-item .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chat-item .del{opacity:0;color:#c66;cursor:pointer;font-size:.85rem;padding:0 4px}
.chat-item:hover .del{opacity:1}
.chat-main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-main .messages{height:auto;flex:1;min-height:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.field{margin-bottom:12px}
.slider-row{display:grid;grid-template-columns:180px 1fr 56px;gap:10px;align-items:center;margin-bottom:12px}
.slider-row label{display:flex;justify-content:space-between;margin:0}
.slider-row .val{font-family:ui-monospace,monospace;font-size:.82rem;color:#77a;text-align:right}
input[type=range]{width:100%;accent-color:#77a;cursor:pointer}
.check-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:.85rem;color:#aaa}
.check-row input{accent-color:#77a}
#imgResult{margin-top:14px}
#imgResult img{max-width:100%;border-radius:8px;border:1px solid #333;margin-top:10px}
#imgResult .status{color:#888;font-size:.85rem}
#imgResult .error{color:#c33;font-size:.85rem}
</style>
</head>
<body>
<div class="header">
<div>
<h1>Playground</h1>
<div class="sub">chat &amp; image experiments against the proxy</div>
</div>
<div><a href="/">dashboard</a><a href="/docs" target="_blank">docs</a></div>
</div>

<div class="tabs">
<button class="tab active" data-tab="chat">Chat</button>
<button class="tab" data-tab="image">Image</button>
</div>

<div id="chat" class="panel active">
<div class="chat-layout">
<div class="chat-sidebar">
<button id="chatNew" class="sidebar-new">New chat</button>
<div id="chatList" class="chat-list"></div>
</div>
<div class="chat-main">
<div class="field">
<label for="chatModel">Model</label>
<input id="chatModel" type="text" list="chatModels" placeholder="type or select a model..." autocomplete="off">
<datalist id="chatModels">
__CHAT_MODELS__
</datalist>
</div>
<div id="chatMessages" class="messages"></div>
<div class="input-row">
<textarea id="chatInput" placeholder="Message... (Enter to send, Shift+Enter for newline)"></textarea>
<button id="chatSend">Send</button>
</div>
</div>
</div>
</div>

<div id="image" class="panel">
<div class="field">
<label for="sdModel">SD Model</label>
<input id="sdModel" type="text" list="sdModels" placeholder="type or select an SD model..." autocomplete="off">
<datalist id="sdModels">
__SD_MODELS__
</datalist>
</div>
<div class="grid">
<div class="field">
<label for="imgWidth">Width</label>
<input id="imgWidth" type="number" value="512" min="256" max="2048" step="64">
</div>
<div class="field">
<label for="imgHeight">Height</label>
<input id="imgHeight" type="number" value="512" min="256" max="2048" step="64">
</div>
</div>
<div class="field">
<label for="posPrompt">Positive prompt</label>
<textarea id="posPrompt" rows="3" placeholder="a cyberpunk city at night, neon lights..."></textarea>
</div>
<div class="field">
<label for="negPrompt">Negative prompt</label>
<textarea id="negPrompt" rows="2" placeholder="blurry, low quality, watermark"></textarea>
</div>
<div class="slider-row">
<label for="imgSteps">Steps</label>
<input id="imgSteps" type="range" min="1" max="150" value="20">
<span class="val" id="imgStepsVal">20</span>
</div>
<div class="slider-row">
<label for="imgCfg">CFG scale</label>
<input id="imgCfg" type="range" min="1" max="30" step="0.5" value="7">
<span class="val" id="imgCfgVal">7</span>
</div>
<div class="slider-row">
<label for="imgSeed">Seed</label>
<input id="imgSeed" type="range" min="0" max="999999" value="0">
<span class="val" id="imgSeedVal">0</span>
</div>
<div class="slider-row">
<label for="imgBatch">Batch size</label>
<input id="imgBatch" type="range" min="1" max="4" value="1">
<span class="val" id="imgBatchVal">1</span>
</div>
<div class="field">
<label for="imgSampler">Sampler</label>
<select id="imgSampler">
<option>Euler</option>
<option>Euler a</option>
<option>LMS</option>
<option>Heun</option>
<option>DPM2</option>
<option>DPM++ 2M</option>
<option>DPM++ 2M Karras</option>
<option>DPM++ SDE</option>
<option>DPM++ SDE Karras</option>
<option>DDIM</option>
<option>UniPC</option>
<option>PLMS</option>
</select>
</div>
<div class="check-row">
<input id="imgRandomSeed" type="checkbox" checked>
<label for="imgRandomSeed" style="margin:0">Random seed</label>
</div>
<button id="imgGenerate">Generate</button>
<div id="imgResult"></div>
</div>

<script>
var chatLog=document.getElementById('chatMessages');
var storeKey='dyva_playground_chats';
var currentChat={id:Date.now(),createdAt:Date.now(),title:'',messages:[]};
function loadChats(){try{return JSON.parse(localStorage.getItem(storeKey))||[]}catch(e){return[]}}
function persistChats(chats){try{localStorage.setItem(storeKey,JSON.stringify(chats))}catch(e){}}
function saveCurrentChat(){
  var chats=loadChats();
  if(!currentChat.messages.length)return;
  var i=-1;
  for(var k=0;k<chats.length;k++){if(chats[k].id===currentChat.id){i=k;break}}
  var copy={id:currentChat.id,createdAt:currentChat.createdAt,title:currentChat.title,messages:currentChat.messages.slice()};
  if(i>=0)chats[i]=copy;else chats.unshift(copy);
  persistChats(chats);
}
function fmtWhen(ts){var d=new Date(ts);return d.toLocaleDateString()+' '+d.toLocaleTimeString()}
function renderSidebar(){
  var list=document.getElementById('chatList');
  list.innerHTML='';
  loadChats().forEach(function(c){
    var item=document.createElement('div');
    item.className='chat-item'+(String(c.id)===String(currentChat.id)?' active':'');
    item.title=fmtWhen(c.createdAt);
    var t=document.createElement('span');t.className='title';t.textContent=c.title||'(untitled)';
    var del=document.createElement('span');del.className='del';del.textContent='✕';
    del.addEventListener('click',function(e){e.stopPropagation();deleteChat(c.id);});
    item.appendChild(t);item.appendChild(del);
    item.addEventListener('click',function(){loadChatById(c.id);});
    list.appendChild(item);
  });
}
function deleteChat(id){
  if(String(currentChat.id)===String(id)){currentChat={id:Date.now(),createdAt:Date.now(),title:'',messages:[]};renderMessages();}
  persistChats(loadChats().filter(function(c){return String(c.id)!==String(id)}));
  renderSidebar();
}
function addMsg(role,text){
  var d=document.createElement('div');d.className='msg '+role;
  var r=document.createElement('div');r.className='role';r.textContent=role==='user'?'You':'Assistant';
  var b=document.createElement('div');b.className='body';
  if(role==='assistant')b.innerHTML=mdRender(text);
  else b.textContent=text;
  d.appendChild(r);d.appendChild(b);chatLog.appendChild(d);
  chatLog.scrollTop=chatLog.scrollHeight;
  return {roleEl:r,bodyEl:b};
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function mdRender(text){
  var out=String(text||'');
  if(window.marked){try{out=window.marked.parse(out)}catch(e){}}
  else{out=escHtml(out).replace(/\n/g,'<br>')}
  if(window.DOMPurify){try{out=window.DOMPurify.sanitize(out)}catch(e){}}
  return out;
}
var renderTimer=null;
function scheduleStreamRender(){
  if(renderTimer)return;
  renderTimer=setTimeout(function(){
    renderTimer=null;
    document.querySelectorAll('.msg.assistant .body.streaming').forEach(function(el){
      el.innerHTML=mdRender(el.getAttribute('data-stream')||'');
    });
    chatLog.scrollTop=chatLog.scrollHeight;
  },60);
}
function renderMessages(){
  chatLog.innerHTML='';
  currentChat.messages.forEach(function(m){addMsg(m.role,m.content)});
}
function setAssistantLabel(el,host,fmodel,tps){
  var s='ASSISTANT';
  if(host)s+=' '+host;
  if(fmodel)s+=' '+fmodel;
  if(tps!==undefined&&tps!==null&&!isNaN(tps))s+=' '+tps+' tps';
  el.textContent=s;
}
function newChat(){saveCurrentChat();currentChat={id:Date.now(),createdAt:Date.now(),title:'',messages:[]};renderMessages();renderSidebar();}
function loadChatById(id){
  saveCurrentChat();
  var c=loadChats().find(function(x){return String(x.id)===String(id)});
  if(!c)return;
  currentChat={id:c.id,createdAt:c.createdAt,title:c.title,messages:c.messages.slice()};
  renderMessages();
  renderSidebar();
}
document.getElementById('chatNew').addEventListener('click',newChat);
renderSidebar();

async function sendChat(){
  var model=document.getElementById('chatModel').value.trim();
  var input=document.getElementById('chatInput');
  var text=input.value.trim();
  var btn=document.getElementById('chatSend');
  if(!model||!text)return;
  addMsg('user',text);
  var bubble=addMsg('assistant','');
  bubble.bodyEl.classList.add('streaming');
  currentChat.messages.push({role:'user',content:text});
  if(!currentChat.title)currentChat.title=text.replace(/\s+/g,' ').slice(0,40);
  input.value='';
  btn.disabled=true;
  try{
    var resp=await fetch('api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:model,messages:currentChat.messages,stream:true})});
    var host=resp.headers.get('X-Dyva-Host')||'';
    var fmodel=resp.headers.get('X-Dyva-Model')||model;
    setAssistantLabel(bubble.roleEl,host,fmodel);
    if(!resp.ok){
      var msg='HTTP '+resp.status;
      try{var j=await resp.json();msg=(j.error&&(j.error.message||j.error))||msg}catch(e){}
      bubble.bodyEl.innerHTML='<span class="error">Error: '+escHtml(msg)+'</span>';
      currentChat.messages.pop();
      return;
    }
    var reader=resp.body.getReader();
    var dec=new TextDecoder();
    var acc='',full='',tps=null;
    while(true){
      var step=await reader.read();
      if(step.done)break;
      acc+=dec.decode(step.value,{stream:true});
      var idx;
      while((idx=acc.indexOf('\n'))>=0){
        var line=acc.slice(0,idx).trim();
        acc=acc.slice(idx+1);
        if(!line)continue;
        var d;
        try{d=JSON.parse(line)}catch(e){continue}
        if(d.message&&d.message.content){
          full+=d.message.content;
          bubble.bodyEl.setAttribute('data-stream',full);
          scheduleStreamRender();
        }
        if(d.done){
          if(d.eval_count&&d.eval_duration)tps=Math.round(d.eval_count/(d.eval_duration/1e9)*10)/10;
          setAssistantLabel(bubble.roleEl,host,fmodel,tps);
          bubble.bodyEl.classList.remove('streaming');
          bubble.bodyEl.removeAttribute('data-stream');
          bubble.bodyEl.innerHTML=mdRender(full);
          chatLog.scrollTop=chatLog.scrollHeight;
          if(full)currentChat.messages.push({role:'assistant',content:full});
          saveCurrentChat();
          renderSidebar();
          return;
        }
      }
    }
    bubble.bodyEl.classList.remove('streaming');
    bubble.bodyEl.removeAttribute('data-stream');
    bubble.bodyEl.innerHTML=mdRender(full);
    setAssistantLabel(bubble.roleEl,host,fmodel,tps);
    if(full)currentChat.messages.push({role:'assistant',content:full});
    saveCurrentChat();
    renderSidebar();
  }catch(ex){
    bubble.bodyEl.classList.remove('streaming');
    bubble.bodyEl.innerHTML='<span class="error">Error: '+escHtml(ex.message)+'</span>';
    currentChat.messages.pop();
  }
  finally{btn.disabled=false;}
}
document.getElementById('chatSend').addEventListener('click',sendChat);
document.getElementById('chatInput').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}
});

function bindSlider(id,out){
  var s=document.getElementById(id),o=document.getElementById(out);
  s.addEventListener('input',function(){o.textContent=s.value;});
}
bindSlider('imgSteps','imgStepsVal');
bindSlider('imgCfg','imgCfgVal');
bindSlider('imgSeed','imgSeedVal');
bindSlider('imgBatch','imgBatchVal');
document.getElementById('imgSeed').addEventListener('input',function(){
  document.getElementById('imgRandomSeed').checked=false;
});
document.getElementById('imgRandomSeed').addEventListener('change',function(){
  if(this.checked){document.getElementById('imgSeed').value=0;document.getElementById('imgSeedVal').textContent=0;}
});

async function generateImage(){
  var btn=document.getElementById('imgGenerate');
  var result=document.getElementById('imgResult');
  var seed=document.getElementById('imgRandomSeed').checked?-1:parseInt(document.getElementById('imgSeed').value)||0;
  var body={
    model:document.getElementById('sdModel').value.trim()||undefined,
    prompt:document.getElementById('posPrompt').value.trim(),
    negative_prompt:document.getElementById('negPrompt').value.trim(),
    width:parseInt(document.getElementById('imgWidth').value)||512,
    height:parseInt(document.getElementById('imgHeight').value)||512,
    steps:parseInt(document.getElementById('imgSteps').value)||20,
    cfg_scale:parseFloat(document.getElementById('imgCfg').value)||7,
    seed:seed,
    batch_size:parseInt(document.getElementById('imgBatch').value)||1,
    sampler_name:document.getElementById('imgSampler').value,
  };
  btn.disabled=true;
  result.innerHTML='<div class="status">generating...</div>';
  try{
    var resp=await fetch('sdapi/v1/txt2img',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!resp.ok){
      var msg='HTTP '+resp.status;
      try{var j=await resp.json();msg=j.error||msg}catch(e){}
      result.innerHTML='<div class="error">Error: '+msg+'</div>';
      return;
    }
    var d=await resp.json();
    var imgs=d.images||[];
    if(!imgs.length){result.innerHTML='<div class="error">No images returned</div>';return;}
    result.innerHTML='';
    imgs.forEach(function(b64){
      var img=document.createElement('img');
      img.src='data:image/png;base64,'+b64;
      result.appendChild(img);
    });
  }catch(ex){result.innerHTML='<div class="error">Error: '+ex.message+'</div>';}
  finally{btn.disabled=false;}
}
document.getElementById('imgGenerate').addEventListener('click',generateImage);

document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    document.querySelectorAll('.panel').forEach(function(x){x.classList.remove('active');});
    t.classList.add('active');
    document.getElementById(t.getAttribute('data-tab')).classList.add('active');
  });
});
</script>
</body>
</html>
