<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dumpster Dyva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Slackey&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#181818}
::-webkit-scrollbar-thumb{background:#444;border-radius:5px;border:2px solid #181818}
::-webkit-scrollbar-thumb:hover{background:#4a4a7a}
*{scrollbar-width:thin;scrollbar-color:#444 #181818}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111;color:#eee;padding:20px;display:flex;flex-direction:column;min-height:100vh}
a {color: #999}
.header{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-shrink:0;position:relative}
.header img{flex-shrink:0}
.activity-btn{margin-left:auto;background:#222;color:#999;border:none;border-radius:6px;padding:8px 16px;font-size:.85rem;cursor:pointer;flex-shrink:0}
.activity-btn:hover{color:#ccc;background:#2a2a3a}
.activity-pop{display:none;position:absolute;top:calc(100% + 8px);right:0;width:min(520px,calc(100vw - 24px));max-height:min(60vh,480px);overflow-y:auto;background:#1e1e1e;border:1px solid #333;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:120;padding:12px 14px}
.activity-pop.open{display:block}
.ap-head{font-size:.95rem;text-transform:uppercase;letter-spacing:.05em;color:#999;margin-bottom:8px;display:flex;align-items:center}
.header-text h1{font-family:"Slackey",sans-serif;font-weight:400;font-size:1.7rem;margin-bottom:2px}
.header-text .sub{color:#999;font-size:.85rem}
.tabs{display:flex;gap:0;margin-bottom:16px;flex-shrink:0;border-bottom:1px solid #333}
.tab{padding:10px 18px;border:none;border-bottom:2px solid transparent;background:transparent;color:#999;font-size:.9rem;cursor:pointer;transition:color .15s,border-color .15s,background .15s}
.tab:hover{color:#ccc;background:#1e1e1e;border-bottom-color:#555}
.tab.active{color:#eee;background:#1e1e1e;border-bottom-color:#77a}
.panel{display:none}
.panel.active{display:block}
body.chat{overflow:hidden}
#chat.panel.active{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr));gap:12px}
.card{background:transparent;border-radius:8px;padding:0;box-shadow:none;overflow:visible}
.card-inner{background:#1e1e1e;border-radius:8px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.4);height:70vh;overflow:hidden;display:flex;flex-direction:column}
/* the click-to-view host card fits its content instead of a fixed height */
#hostCard .card-inner{height:auto;max-height:70vh}
/* tabs + filter stay pinned; only the list scrolls */
#mpane-text,#mpane-image,#pane-last,#pane-good,#pane-maybe,#pane-bad,#hostList{flex:1;min-height:0;overflow-y:auto}
.card h2{font-size:.95rem;text-transform:uppercase;letter-spacing:.05em;color:#999;margin-bottom:10px;cursor:pointer;user-select:none}
.status-line{padding:2px 0;font-size:.78rem}
.status-searching{color:#888}
.status-trying{color:#77a}
.status-connected{color:#4a4}
.status-failed{color:#c33}
.content-line{padding:2px 0;color:#ccc}
.done-line{color:#666;font-style:italic}
.model-item{padding:6px 0;border-bottom:1px solid #333;font-size:.85rem;display:flex;justify-content:space-between}
.model-item:last-child{border:none}
.model-name{font-family:ui-monospace,monospace;font-size:.82rem;max-width:33%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model-count{color:#888;flex-shrink:0;padding-left:8px;white-space:nowrap}
.modellist .model-item{cursor:pointer;transition:background .1s;overflow-wrap:anywhere}
.modellist .model-item:hover{background:#2a2a3a}
.host-name{font-family:ui-monospace,monospace;font-size:.82rem;flex:1;min-width:0;color:#eee;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.host-checked{color:#777;flex-shrink:0;padding-left:8px;white-space:nowrap;font-size:.78rem}
.host-model{font-family:ui-monospace,monospace;font-size:.82rem;color:#777;max-width:50%;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skip-link{opacity:0;color:#77a;font-size:.75rem;text-decoration:underline;margin:0 8px;flex-shrink:0;transition:opacity .1s}
.model-item:hover .skip-link{opacity:1}
.host-tabs{display:flex;gap:4px;border-bottom:1px solid #333;margin-bottom:12px;flex-shrink:0}
.htab{background:transparent;color:#999;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;padding:7px 14px;font-size:.8rem;cursor:pointer;display:inline-flex;align-items:center;gap:5px;border-radius:6px 6px 0 0}
.htab:hover{color:#ccc;background:#26262e;border-bottom-color:#555}
.htab.active{color:#eee;background:#1e1e1e;border-bottom-color:#77a}
.htab-clear{margin-left:auto;align-self:center;color:#c33;font-size:.75rem;text-decoration:underline;cursor:pointer}
.htab-clear:hover{color:#e55}
.htab-count{background:#2a2a3a;color:#aaa;border-radius:8px;padding:1px 6px;font-size:.68rem;font-family:ui-monospace,monospace;min-width:1.4em;text-align:center;line-height:1.4}
.htab.active .htab-count{background:#33334a;color:#ccd}
.more{font-size:.8rem;color:#666;margin-top:6px}
.card.collapsed h2::before{transform:rotate(-90deg)}
.card.collapsed .card-inner{display:none}

label{display:block;font-size:.8rem;color:#999;margin-bottom:6px}
input[type=text],input[type=number],textarea,select{width:100%;padding:8px 10px;border:1px solid #444;border-radius:6px;background:#2a2a2a;color:#eee;font-size:.85rem;outline:none;font-family:ui-monospace,monospace}
input[type=text]:focus,input[type=number]:focus,textarea:focus,select:focus{border-color:#888}
#modelFilter{margin-bottom:8px;flex-shrink:0}
textarea{resize:vertical;min-height:64px}
button{background:#3a3a5a;color:#eee;border:none;border-radius:6px;padding:10px 20px;font-size:.9rem;cursor:pointer}
button:hover{background:#4a4a7a}
button:disabled{opacity:.5;cursor:default}
button.stop{background:#5a2a2a}
button.stop:hover{background:#7a3a3a}
.messages{border:1px solid #333;border-radius:8px;background:#181818;height:46vh;overflow-y:auto;padding:.75em;margin-bottom:.75em}
.msg{margin-bottom:.75em}
.msg .role{font-size:.72rem;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.25em;display:flex;align-items:center;gap:.4em;position:relative}
.msg .actions{display:inline-flex;align-items:center;gap:.2em;height:.75rem;overflow:hidden;opacity:0;pointer-events:none}
.msg:hover .actions{opacity:1;pointer-events:auto}
.msg .actions .act{cursor:pointer;color:#77a;font-size:.6rem;padding:0 3px;border-radius:3px;user-select:none;line-height:1;height:1em;display:inline-flex;align-items:center}
.msg .actions .act:hover{background:#2a2a4a}
.msg .editbox{width:100%;min-height:3em;background:#111;border:1px solid #444;border-radius:6px;color:#eee;padding:.5em;font-size:.85rem;font-family:ui-monospace,monospace;outline:none;resize:vertical}
.msg.user .role{color:#77a}
.msg-time{margin-left:auto;color:#666;font-size:.68rem;letter-spacing:0;text-transform:none;font-weight:400;flex-shrink:0}
.msg .body{background:#1e1e1e;border-radius:8px;padding:.7em;font-size:.9rem;overflow-wrap:anywhere;line-height:1.45}
.msg .body .error{color:#c33}
.rummage-wrap{display:flex;align-items:center;gap:14px}
.rummage{width:96px;height:96px;flex-shrink:0;display:block;border-radius:8px}
.rummage-msg{color:#9a9aa8;font-size:.9rem;font-style:italic}
@keyframes spin{to{transform:rotate(360deg)}}
#snackbar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(8px);display:flex;align-items:center;gap:10px;background:#1e1e1e;border:1px solid #3a3a4a;color:#ddd;border-radius:8px;padding:10px 16px;font-size:.85rem;box-shadow:0 6px 24px rgba(0,0,0,.5);z-index:250;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#snackbar.show{opacity:1;transform:translateX(-50%) translateY(0)}
#snackbar .snack-spin{width:14px;height:14px;border:2px solid #444;border-top-color:#77a;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
.msg.user .body{background:#222a3a;white-space:pre-wrap}
.msg.assistant .body pre{background:#111;border:1px solid #333;border-radius:6px;padding:.6em;overflow-x:auto;white-space:pre;margin:.6em 0}
.msg.assistant .body code{font-family:ui-monospace,monospace;font-size:.82rem;background:#111;padding:.05em .3em;border-radius:4px}
.msg.assistant .body pre code{background:none;padding:0}
.msg.assistant .body a{color:#77a}
.msg.assistant .body blockquote{border-left:3px solid #444;margin:.6em 0;padding:.2em .7em;color:#aaa}
.msg.assistant .body table{border-collapse:collapse;margin:.6em 0}
.msg.assistant .body th,.msg.assistant .body td{border:1px solid #444;padding:.3em .5em}
.msg.assistant .body ul,.msg.assistant .body ol{margin:.4em 0;padding-left:1.4em}
.msg.assistant .body li{margin:.15em 0}
.msg.assistant .body p{margin:.35em 0}
.msg.assistant .body h1,.msg.assistant .body h2,.msg.assistant .body h3,.msg.assistant .body h4{margin:.7em 0 .3em}
.msg.assistant .body hr{border:none;border-top:1px solid #444;margin:.7em 0}
.input-row{display:flex;gap:8px;align-items:stretch}
.input-row textarea{flex:1;min-height:64px}
.input-tools{display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.input-tools button{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 14px}
.input-tools button.active{color:#9ab8ff;background:#2a2a4a}
.input-row button svg{width:1.1em;height:1.1em}
.attach-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.5em}
.attach-chip{display:flex;align-items:center;gap:6px;background:#1e1e1e;border:1px solid #333;border-radius:6px;padding:3px 6px;font-size:.75rem;color:#ccc;max-width:220px}
.attach-chip img{width:26px;height:26px;object-fit:cover;border-radius:4px;flex-shrink:0}
.attach-chip .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach-chip .x{cursor:pointer;color:#c66;padding:0 2px;flex-shrink:0}
.msg .files{display:flex;flex-wrap:wrap;gap:6px;margin-top:.5em}
.msg .files img{max-width:160px;max-height:160px;border-radius:6px;border:1px solid #333}
.msg .body p img{max-width:min(360px,100%);border-radius:8px;display:block;margin:6px 0}
.msg .files img,.msg .body img{cursor:zoom-in}
.msg .file-chip{display:inline-block;background:#222a3a;border:1px solid #333;border-radius:6px;padding:3px 8px;font-size:.75rem;color:#77a;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

details.thinkbox{margin:.15em 0 .55em;border-left:3px solid #3a3a46;background:#17171d;border-radius:4px;padding:.25em .65em}
details.thinkbox>summary{cursor:pointer;color:#888894;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;user-select:none}
.think-body{white-space:pre-wrap;color:#9a9aa8;font-size:.8rem;line-height:1.45;font-style:italic;margin-top:.3em;max-height:320px;overflow:auto}

.chat-status{display:flex;align-items:center;gap:.45em;color:#8a8a96;font-size:.75rem;font-style:italic;margin:.15em 0 .3em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-status::before{content:'';flex-shrink:0;width:.6em;height:.6em;border:1.5px solid #444;border-top-color:#77a;border-radius:50%;animation:spin .8s linear infinite}
.chat-layout{display:flex;gap:12px;flex:1;min-height:0;max-height:calc(100vh - 10rem)}
.chat-menu-btn{display:none}
.chat-backdrop{display:none}
@media(max-width:640px){
  body{padding:10px}
  .header{margin-bottom:12px;gap:8px}
  .header-text h1{font-size:1.25rem}
  .header-text .sub{font-size:.75rem}
  .header img{width:34px;height:34px}
  .tabs{flex-shrink:0}
  .tabs .tab{flex:1;text-align:center;padding:10px 6px}
  #chat.panel.active{min-height:0}
  .chat-layout{max-height:calc(100vh - 12rem);gap:0}
  .chat-menu-btn{display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:8px 12px;font-size:1rem;height:100%}
  .chat-sidebar{position:fixed;top:0;bottom:0;left:0;width:240px;max-width:80vw;z-index:100;border-radius:0;border-right:1px solid #333;box-shadow:0 0 24px rgba(0,0,0,.6);transform:translateX(-100%);transition:transform .2s ease}
  .chat-sidebar.open{transform:translateX(0)}
  .chat-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99}
  .chat-backdrop.open{display:block}
  .chat-main textarea{font-size:16px}
  .msg .body{font-size:.85rem}
  .input-tools button{padding:8px 12px}
}
.chat-sidebar{width:220px;flex-shrink:0;border:1px solid #333;border-radius:8px;background:#181818;display:flex;flex-direction:column;overflow:hidden}
.sidebar-new{margin:10px;flex-shrink:0}
.chat-list{flex:1;overflow-y:auto;padding:0 6px 10px}
.chat-item{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px;border-radius:6px;cursor:pointer;font-size:.8rem;color:#ccc}
.chat-item:hover{background:#2a2a3a}
.chat-item.active{background:#2a2a4a}
.chat-item .title{overflow:hidden;white-space:nowrap;flex:1}
.chat-item .del{opacity:0;color:#c66;cursor:pointer;font-size:.85rem;padding:0 4px}
.chat-item:hover .del{opacity:1}
.chat-item .dl{opacity:0;color:#77a;cursor:pointer;font-size:.85rem;padding:0 4px}
.chat-item:hover .dl{opacity:1}
.chat-item .dl:hover{color:#aae}
.chat-item .re{opacity:0;color:#7a7;cursor:pointer;font-size:.85rem;padding:0 4px}
.chat-item:hover .re{opacity:1}
.chat-item .re:hover{color:#9c9}
.chat-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.chat-main .messages{height:auto;flex:1;min-height:0;overflow-y:auto}
.chat-main .field,.chat-main .input-row{flex-shrink:0}
.chat-main .field{margin-bottom:.5em}
.model-picker{display:flex;gap:8px;align-items:center}
.model-picker input{flex:1}
/* combined "N matching servers" count + advance-to-next-server control */
.chat-advance{flex-shrink:0;background:#2a2a3a;color:#77a;border:none;border-radius:6px;height:2.2em;display:flex;align-items:center;gap:.4em;cursor:pointer;font-size:.85rem;font-family:ui-monospace,monospace;line-height:1;padding:0 .6em}
.chat-advance:hover{color:#fff;background:#3a3a5a}
.chat-advance:disabled{opacity:.5;cursor:default}
.chat-advance #chatModelCount{min-width:1.6em;text-align:center}
.chat-advance .adv-arrow{font-size:.8em;opacity:.75}
/* tool toggle sharing the model-selector row */
.mp-tool{flex-shrink:0;background:#2a2a3a;color:#77a;border:none;border-radius:6px;width:2.2em;height:2.2em;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.mp-tool:hover{color:#fff;background:#3a3a5a}
.mp-tool.active{color:#9ab8ff;background:#2a2a4a}
.mp-tool svg{width:18px;height:18px}
/* wrench pull-down: opens upward with a caret pointing down at the wrench */
.tool-menu{position:relative;flex-shrink:0}
.tools-pop{display:none;position:absolute;bottom:calc(100% + 10px);right:0;width:250px;background:#1e1e1e;border:1px solid #3a3a4a;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.5);padding:10px;z-index:130}
.tools-pop.open{display:block}
.tools-pop::before,.tools-pop::after{content:'';position:absolute;top:100%;right:.75em;width:0;height:0;border:8px solid transparent}
.tools-pop::before{border-top-color:#3a3a4a}
.tools-pop::after{border-top-color:#1e1e1e;top:calc(100% - 1px)}
.tools-pop-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:#999;margin-bottom:8px}
.tool-opt{display:flex;align-items:flex-start;gap:9px;padding:7px 6px;border-radius:6px;cursor:pointer}
.tool-opt:hover{background:#26262e}
.tool-opt input[type=checkbox]{width:auto;margin:2px 0 0;accent-color:#77a;cursor:pointer}
.tool-opt .tool-txt{display:flex;flex-direction:column}
.tool-opt .tool-txt b{font-weight:500;font-size:.85rem;color:#eee}
.tool-opt .tool-txt small{color:#888;font-size:.72rem;margin-top:1px}
.field{margin-bottom:12px}
.img-params{display:grid;grid-template-columns:2.2fr 1fr;gap:12px;margin-bottom:12px}
.img-dims{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.slider-row{display:grid;grid-template-columns:180px 1fr 56px;gap:10px;align-items:center;margin-bottom:12px}
.slider-row label{display:flex;justify-content:space-between;margin:0}
.slider-row .val{font-family:ui-monospace,monospace;font-size:.82rem;color:#77a;text-align:right}
.img-advanced{border:1px solid #333;border-radius:8px;background:#191919;padding:0 10px;margin-bottom:12px}
.img-advanced>summary{cursor:pointer;padding:8px 0;font-size:.85rem;color:#aaa;user-select:none;list-style:none}
.img-advanced>summary::-webkit-details-marker{display:none}
.img-advanced>summary::before{content:'▸ ';color:#666}
.img-advanced[open]>summary::before{content:'▾ '}
.img-advanced .slider-row:last-child{padding-bottom:8px}
input[type=range]{width:100%;accent-color:#77a;cursor:pointer}
.check-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:.85rem;color:#aaa}
.check-row input{accent-color:#77a}
#imgResult{margin-top:14px}
#imgResult img{max-width:100%;border-radius:8px;border:1px solid #333;margin-top:10px}
#imgResult .status{color:#888;font-size:.85rem}
#imgResult .error{color:#c33;font-size:.85rem}
#image{max-width:none}
.img-layout{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.img-main{flex:1 1 460px;min-width:0;max-width:640px}
.img-side{flex:1 1 300px;min-width:260px}
.img-side-title{font-size:.95rem;text-transform:uppercase;letter-spacing:.05em;color:#999;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.mini-search{background:#1a1a1f;border:1px solid #333;color:#ddd;font-size:.75rem;padding:3px 8px;border-radius:6px;width:180px;margin-left:auto;text-transform:none;letter-spacing:0}
.mini-search:focus{outline:none;border-color:#77a}
.mini-search::placeholder{color:#666}
#imgHistory{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.hist-item{position:relative;display:flex;gap:10px;align-items:center;cursor:zoom-in;border:1px solid #333;border-radius:8px;padding:6px;background:#191919}
.hist-item:hover{border-color:#77a}
.hist-del{position:absolute;top:2px;right:4px;color:#555;cursor:pointer;font-size:.75rem;line-height:1;padding:2px 5px;border-radius:4px;z-index:2}
.hist-del:hover{color:#e55;background:#2a2a2a}
.hist-item img{width:72px;height:72px;object-fit:cover;border-radius:5px;flex-shrink:0}
.hist-meta{min-width:0;font-size:.75rem;display:flex;flex-direction:column;gap:2px}
.hist-prompt{color:#aaa;font-size:.72rem;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-model{color:#ccc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-host{color:#777;font-family:ui-monospace,monospace;font-size:.68rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;cursor:zoom-out}
#lightbox.open{display:flex}
#lightbox img{max-width:90vw;max-height:78vh;border-radius:8px}
#lightbox .cap{color:#ccc;font-size:.85rem;max-width:90vw;overflow-wrap:anywhere;text-align:center}
</style>
</head>
<body>
<div id="snackbar" class="show"><span class="snack-spin"></span><span class="snack-msg">Loading…</span></div>
<div class="header">
<img src="dyva.avif" alt="" width="56" height="56">

<script>
var evtSource=new EventSource('api/activity');
var paused=false;
function refreshLists(){fetch('dashboard-data').then(function(r){return r.json()}).then(function(d){_good=new Set(d.good||[]);_bad=new Set(d.bad||[]);renderHostLists(d)}).catch(function(){})}
evtSource.onmessage=function(e){try{if(paused)return;var d=JSON.parse(e.data);if(!d.message)return;if(d.status==='connected'||d.status==='failed')refreshLists();paintGenStatus(activeStatus,d);paintGenStatus(activeImgStatus,d);var c=document.getElementById('activityList');var p=document.createElement('div');p.className='status-line status-'+d.status;var t=d.time?new Date(d.time*1e3).toISOString():'';var s=d.duration!==undefined?' <span style=color:#666>['+d.duration.toFixed(2)+'s]</span>':'';p.innerHTML='<span style=color:#aaa>'+t+'</span>'+s+' '+d.message;c.insertBefore(p,c.firstChild);while(c.children.length>50)c.removeChild(c.lastChild)}catch(ex){}}
document.getElementById('pauseBtn').addEventListener('click',function(e){e.stopPropagation();paused=!paused;this.textContent=paused?'▷':'⏸';this.style.fontSize=paused?'.9rem':'1.1rem'})
var actPop=document.getElementById('activityPop');
document.getElementById('activityBtn').addEventListener('click',function(e){e.stopPropagation();actPop.classList.toggle('open')});
document.addEventListener('keydown',function(e){if(e.key==='Escape')actPop.classList.remove('open')});
</script>
<script>
function filterModels(){
  var q=document.getElementById('modelFilter').value.toLowerCase();
  document.querySelectorAll('.modellist .model-item').forEach(function(el){el.style.display=el.getAttribute('data-name').toLowerCase().includes(q)?'':'none'});
  // the same query re-renders the Hosts card panes from the full arrays, so it
  // searches the whole list and the "... and N more" count matches the results
  if(typeof renderHostPanes==='function')renderHostPanes();
}
document.getElementById('clearBad').addEventListener('click',function(e){e.preventDefault();e.stopPropagation();
  var x=new XMLHttpRequest();x.open('GET','clear-bad');
  x.onload=function(){location.reload()};x.send()})

document.querySelectorAll('.htab[data-pane]').forEach(function(t){
  t.addEventListener('click',function(){
    var pane=t.getAttribute('data-pane');
    document.querySelectorAll('.htab[data-pane]').forEach(function(x){x.classList.toggle('active',x===t)});
    ['good','maybe','bad','last'].forEach(function(p){document.getElementById('pane-'+p).style.display=p===pane?'':'none'});
    localStorage.setItem('dyva_hostpane',pane);
  })
});
var savedPane=localStorage.getItem('dyva_hostpane');
if(savedPane&&savedPane!=='last'){var pb=document.querySelector('.htab[data-pane="'+savedPane+'"]');if(pb)pb.click()}

document.querySelectorAll('[data-mpane]').forEach(function(t){
  t.addEventListener('click',function(){
    var p=t.getAttribute('data-mpane');
    document.querySelectorAll('[data-mpane]').forEach(function(x){x.classList.toggle('active',x===t)});
    ['text','image'].forEach(function(k){document.getElementById('mpane-'+k).style.display=k===p?'':'none'});
    try{localStorage.setItem('dyva_modelpane',p)}catch(e){}
  })
});
try{var savedMpane=localStorage.getItem('dyva_modelpane');if(savedMpane&&savedMpane!=='text'){var mb=document.querySelector('[data-mpane="'+savedMpane+'"]');if(mb)mb.click()}}catch(e){}

document.querySelectorAll('.card').forEach(function(card){
  var h2=card.querySelector('h2');
  if(!h2)return;
  var key='dyva_collapsed_'+h2.textContent.replace(/[^a-z0-9]+/gi,'_').toLowerCase();
  if(localStorage.getItem(key)==='1')card.classList.add('collapsed');
  h2.addEventListener('click',function(){
    card.classList.toggle('collapsed');
    localStorage.setItem(key,card.classList.contains('collapsed')?'1':'0')
  })
})

var _currentModel=null;
// Server Room data is fetched (not inlined) and rendered here, so each host
// string lives in the payload once instead of being repeated per model.
var modelHosts={},hostChecked={},imageModels={};
var _good=new Set(),_bad=new Set();
function checkedAgo(iso){if(!iso)return'';var t=Date.parse(iso);if(isNaN(t))return'';var days=Math.floor((Date.now()-t)/86400000);if(days<=0)return'today';if(days===1)return'1 day';return days+' days'}
function modelStatus(mid){var hs=modelHosts[mid]||[],g=0,b=0;hs.forEach(function(h){if(_good.has(h+' '+mid))g++;else if(_bad.has(h+' '+mid))b++});return g+'/'+b+'/'+(hs.length-g-b)}
function makeModelRow(mid){var d=document.createElement('div');d.className='model-item';d.setAttribute('data-name',mid);d.title=mid;var n=document.createElement('span');n.className='model-name';n.textContent=mid;var c=document.createElement('span');c.className='model-count';c.textContent=modelStatus(mid);d.appendChild(n);d.appendChild(c);return d}
function renderModels(servers){
  modelHosts={};hostChecked={};imageModels={};
  servers.forEach(function(s){
    var host=s.host||'';if(s.checked)hostChecked[host]=s.checked;
    var isImg=(s.service==='a1111'||s.service==='comfyui');
    (s.models||[]).forEach(function(m){
      if(isImg){imageModels[m]=1;var t=m.indexOf(' [');if(t>=0)imageModels[m.slice(0,t)]=1}
      if(/[:-]cloud/.test(m)||!m.length)return;
      (modelHosts[m]=modelHosts[m]||[]).push(host);
    });
  });
  var mid;for(mid in modelHosts)modelHosts[mid].sort();
  var ids=Object.keys(modelHosts);
  ids.sort(function(a,b){return modelHosts[b].length-modelHosts[a].length||(a<b?-1:a>b?1:0)});
  var fT=document.createDocumentFragment(),fI=document.createDocumentFragment();
  ids.forEach(function(id){(imageModels[id]?fI:fT).appendChild(makeModelRow(id))});
  var lt=document.getElementById('modelList');lt.innerHTML='';lt.appendChild(fT);
  var li=document.getElementById('modelListImage');li.innerHTML='';li.appendChild(fI);
  filterModels();
}
function hostRow(host,model,skipHref){
  var d=document.createElement('div');d.className='model-item';
  var h=document.createElement('span');h.className='host-name';h.textContent=host;h.title=host;d.appendChild(h);
  if(skipHref){var a=document.createElement('a');a.className='skip-link';a.href=skipHref;a.textContent='skip';d.appendChild(a)}
  var mm=document.createElement('span');mm.className='host-model';mm.textContent=model||'(any)';mm.title=model||'(any)';d.appendChild(mm);
  return d;
}
// Full sorted key arrays are stored so the model filter can search the WHOLE
// list (not just the 30 rendered rows) and the "... and N more" count reflects
// the actual number of matches beyond what's shown.
var _hostData={last:[],good:[],maybe:[],bad:[]};
function _byModel(a,b){var am=a.slice(a.indexOf(' ')+1),bm=b.slice(b.indexOf(' ')+1);return am<bm?-1:am>bm?1:(a<b?-1:a>b?1:0)}
function _setCount(id,n){var e=document.getElementById(id);if(e)e.textContent=n}
function renderKeyPane(listId,moreId,countId,arr,q,skip){
  var c=document.getElementById(listId);c.innerHTML='';
  var matched=q?arr.filter(function(x){return x.toLowerCase().indexOf(q)>=0}):arr;
  matched.slice(0,30).forEach(function(x){
    var i=x.indexOf(' '),h=x.slice(0,i),mo=x.slice(i+1);
    c.appendChild(hostRow(h,mo,skip?'skip-good?host='+encodeURIComponent(h)+'&model='+encodeURIComponent(mo):null));
  });
  var more=matched.length-Math.min(matched.length,30);
  document.getElementById(moreId).innerHTML=more>0?'<div class="more">... and '+more+' more</div>':'';
  _setCount(countId,matched.length);
}
function renderHostPanes(){
  var q=document.getElementById('modelFilter').value.toLowerCase();
  var last=document.getElementById('lastList');last.innerHTML='';
  var lm=q?_hostData.last.filter(function(e){return ((e.host||'')+' '+(e.model||'')).toLowerCase().indexOf(q)>=0}):_hostData.last;
  if(!lm.length){last.innerHTML='<div style="color:#999;font-size:.85rem">None</div>'}
  else lm.forEach(function(e){last.appendChild(hostRow(e.host,e.model,'next-host?model='+encodeURIComponent(e.model||'')))});
  _setCount('cnt-last',lm.length);
  renderKeyPane('goodList','goodMore','cnt-good',_hostData.good,q,true);
  renderKeyPane('maybeList','maybeMore','cnt-maybe',_hostData.maybe,q,true);
  renderKeyPane('badList','badMore','cnt-bad',_hostData.bad,q,false);
}
function renderHostLists(d){
  _hostData.last=d.last||[];
  _hostData.good=(d.good||[]).filter(function(x){return x.indexOf(' ')>=0}).sort(_byModel);
  _hostData.maybe=(d.maybe||[]).filter(function(x){return x.indexOf(' ')>=0}).sort(_byModel);
  _hostData.bad=(d.bad||[]).filter(function(x){return x.indexOf(' ')>=0}).sort();
  renderHostPanes();
}
// The snackbar is server-rendered visible (in the markup with class "show") so
// it paints on first load without waiting for JS; here we only take it down.
var snackbar=document.getElementById('snackbar');
var _snackTimer=null;
function showSnack(msg,spin){
  if(_snackTimer){clearTimeout(_snackTimer);_snackTimer=null;}
  snackbar.querySelector('.snack-msg').textContent=msg;
  snackbar.querySelector('.snack-spin').style.display=(spin===false)?'none':'';
  snackbar.classList.add('show');
}
function hideSnack(){snackbar.classList.remove('show')}
function loadDashboard(){
  Promise.all([
    fetch('dashboard-models').then(function(r){return r.json()}),
    fetch('dashboard-data').then(function(r){return r.json()})
  ]).then(function(res){
    var mv=res[0]||{},dv=res[1]||{};
    _good=new Set(dv.good||[]);_bad=new Set(dv.bad||[]);
    renderModels(mv.servers||[]);
    renderHostLists(dv);
    hideSnack();
  }).catch(function(){
    showSnack('Couldn’t load dashboard data',false);
    _snackTimer=setTimeout(hideSnack,4000);
  });
}
document.getElementById('serverroom').addEventListener('click',function(e){
  var el=e.target.closest('.modellist .model-item[data-name]');if(!el)return;
  document.querySelectorAll('.modellist .model-item').forEach(function(x){x.style.background=''});
  el.style.background='#2a2a4a';_currentModel=el.getAttribute('data-name');
  var hosts=(modelHosts[_currentModel]||[]).slice().sort(function(a,b){
    var ta=hostChecked[a]?Date.parse(hostChecked[a]):NaN,tb=hostChecked[b]?Date.parse(hostChecked[b]):NaN;
    if(isNaN(ta))ta=-Infinity;if(isNaN(tb))tb=-Infinity;
    return tb-ta||(a<b?-1:a>b?1:0);
  });
  var card=document.getElementById('hostCard');card.style.display='';
  document.getElementById('hostCardTitle').textContent=_currentModel+' ('+hosts.length+' hosts)';
  var list=document.getElementById('hostList');list.innerHTML='';
  hosts.forEach(function(h){var d=document.createElement('div');d.className='model-item';var s=document.createElement('span');s.className='host-name';s.textContent=h;s.title=h;d.appendChild(s);var ago=checkedAgo(hostChecked[h]);if(ago){var t=document.createElement('span');t.className='host-checked';t.textContent=ago;t.title=hostChecked[h];d.appendChild(t)}list.appendChild(d)});
});
loadDashboard();
</script>
<script>
var chatLog=document.getElementById('chatMessages');
var storeKey='dyva_playground_chats';
var currentChat={id:Date.now(),createdAt:Date.now(),title:'',model:'',messages:[]};
var chatsCache=[];
function loadChats(){return chatsCache}
// Saves are ASYNC + debounced + serialized. A synchronous POST here froze the
// UI on every chat switch (the main thread blocked on the server round-trip,
// which is slow on mobile while the proxy is racing hosts). The in-memory
// chatsCache updates immediately so reads never wait on the network.
var _saveTimer=null,_savePending=false,_saveInFlight=false;
function persistChats(chats){
  chatsCache=chats.slice();
  _savePending=true;
  if(!_saveTimer)_saveTimer=setTimeout(flushChats,250);
}
function flushChats(){
  _saveTimer=null;
  if(_saveInFlight){_saveTimer=setTimeout(flushChats,250);return}
  if(!_savePending)return;
  _savePending=false;_saveInFlight=true;
  try{
    var x=new XMLHttpRequest();x.open('POST','api/chats',true);
    x.setRequestHeader('Content-Type','application/json');
    x.onloadend=function(){_saveInFlight=false;if(_savePending&&!_saveTimer)_saveTimer=setTimeout(flushChats,250)};
    x.send(JSON.stringify({chats:chatsCache}));
  }catch(e){_saveInFlight=false}
}
// flush any pending save when the page is backgrounded/closed, without blocking
function _beaconSave(){
  if(!_savePending)return;
  try{
    if(navigator.sendBeacon){
      var ok=navigator.sendBeacon('api/chats',new Blob([JSON.stringify({chats:chatsCache})],{type:'application/json'}));
      if(ok){_savePending=false;return}
    }
  }catch(e){}
}
window.addEventListener('pagehide',_beaconSave);
document.addEventListener('visibilitychange',function(){if(document.hidden)_beaconSave()});
(function(){
  var x=new XMLHttpRequest();x.open('GET','api/chats',false);
  try{x.send()}catch(e){return}
  if(x.status===200){
    try{chatsCache=JSON.parse(x.responseText).chats||[]}catch(e){chatsCache=[]}
  }
  if(!chatsCache.length){
    var ls=null;
    try{ls=JSON.parse(localStorage.getItem(storeKey)||'null')}catch(e){}
    if(ls&&ls.length){persistChats(ls);if(window.console)console.info('dyva: migrated '+ls.length+' local chat(s) to server storage')}
  }
})();
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  for(var k in gens)return;   // don't clobber chat list while a generation is running
  try{if(localStorage.getItem('dyva_inflight'))return}catch(e){}
  var x=new XMLHttpRequest();
  x.open('GET','api/chats');
  x.onload=function(){
    if(x.status!==200)return;
    try{
      var nc=JSON.parse(x.responseText).chats||[];
      if(JSON.stringify(nc)!==JSON.stringify(chatsCache)){chatsCache=nc;renderSidebar()}
    }catch(e){}
  };
  x.send();
});
function saveCurrentChat(){
  var chats=loadChats();
  if(!currentChat.messages.length)return;
  var i=-1;
  for(var k=0;k<chats.length;k++){if(chats[k].id===currentChat.id){i=k;break}}

function cleanTitle(txt){

  // else whatever follows the last <|message|>
  var fin=txt.match(/<\|channel\|>\s*final\s*<\|message\|>([\s\S]*?)(?:<\||$)/i);
  if(fin){txt=fin[1];}
  else{var lm=txt.lastIndexOf('<|message|>');if(lm>=0)txt=txt.slice(lm+11);}
  txt=txt.replace(/<\|[^>]*\|?>/g,' ');           // strip <|channel|>, <|start|>, malformed <|channel>
  txt=txt.replace(/<\/?[a-z][^>]*>/gi,' ');        // strip stray xml-ish tags

function b64toText(b64){

    var s=b64.indexOf(',')>=0?b64.slice(b64.indexOf(',')+1):b64;
    var bin=atob(s);
    var bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }catch(e){return ''}

function chatPayload(c){

    if(m.role==='user'&&m.files&&m.files.length){
      var parts=[];
      if(m.content)parts.push({type:'text',text:m.content});
      m.files.forEach(function(f){
        var b64=f.dataUrl||'';
        if(!b64)return;
        var mt=f.type||'application/octet-stream';
        var name=f.name||'file';
        var txt=b64toText(b64);
        if(mt.indexOf('text/')===0||mt.indexOf('json')>=0||mt.indexOf('xml')>=0||mt.indexOf('csv')>=0||mt.indexOf('javascript')>=0||mt.indexOf('shell')>=0){
          parts.push({type:'text',text:'\n\n--- File: '+name+' ---\n'+(txt||'[binary content]')});
        }else{

  })};
}

  function live(){return inView()&&gen.bubble&&gen.bubble.bodyEl.isConnected}
  function setStatus(t){if(gen.statusEl&&gen.statusEl.parentNode)gen.statusEl.textContent=t}
  function clearInflight(){try{localStorage.removeItem('dyva_inflight')}catch(e){}}
  function keepInflight(){try{var m=JSON.parse(localStorage.getItem('dyva_inflight')||'null');if(!m)return;m.n=(m.n||0)+1;if(m.n<=2)localStorage.setItem('dyva_inflight',JSON.stringify(m));else localStorage.removeItem('dyva_inflight')}catch(e){try{localStorage.removeItem('dyva_inflight')}catch(e2){}}}
  try{sessionStorage.setItem('dyva_own','1')}catch(e){}
  var full='',think='',tps=null,acc='',toolCalls=[],host='',fmodel=model;
  async function complete(){
    clearInflight();
    if(useTools&&toolCalls.length&&depth<3){
      await runToolRound();
      return;
    }
    finishStream(gen.bubble,live(),host,fmodel,tps,chatId,chatCreated,chatTitle,model,think,full);
  }
  async function runToolRound(){
    setStatus('calling tool\u2026');
    var results=[],urls=[];
    for(var i=0;i<toolCalls.length;i++){
      if(ac.signal.aborted)return;
      var tc=toolCalls[i]||{},fn=tc.function||{};
      var args={};
      try{args=typeof fn.arguments==='string'?JSON.parse(fn.arguments||'{}'):(fn.arguments||{})}catch(e){}
      if(fn.name==='generate_image'){
        setStatus('generating image\u2026');
        try{
          var ib={prompt:String(args.prompt||'').trim().slice(0,2000)};
          if(args.negative_prompt)ib.negative_prompt=String(args.negative_prompt).trim().slice(0,1000);
          var r2=await fetch('sdapi/v1/txt2img',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(ib),signal:ac.signal});
          if(r2.ok){
            var j=await r2.json();
            var fl=j._dyva_files||[];
            if(fl.length){
              fl.forEach(function(f){urls.push('sdapi/v1/images/'+f)});
              results.push({text:'Images generated successfully:\n'+fl.map(function(f){return 'sdapi/v1/images/'+f}).join('\n'),md:fl.map(function(f){return '![generated image](sdapi/v1/images/'+f+')'}).join('\n\n')});
            }else results.push({text:'Error: image service returned no images'});
          }else{
            var em='HTTP '+r2.status;
            try{var je=await r2.json();em=je.error||em}catch(e){}
            results.push({text:'Error generating image: '+em});
          }
        }catch(ex){
          if(ac.signal.aborted)return;
          results.push({text:'Error generating image: '+ex.message});
        }
      }else results.push({text:'Error: unknown tool '+fn.name});
    }
    msgs.push({role:'assistant',content:full,tool_calls:toolCalls,_meta:{hidden:true}});
    results.forEach(function(res){msgs.push({role:'tool',content:res.text,_meta:{hidden:true}})});
    if(inView())saveCurrentChat();
    if(full.trim())appendMsgRecord(chatId,{role:'assistant',content:full});
    results.forEach(function(res){
      if(!res.md)return;
      appendMsgRecord(chatId,{role:'assistant',content:res.md});
    });
    var nb=null;
    if(inView()){
      renderMessages();
      nb=addMsg('assistant','');
      nb.bodyEl.classList.add('streaming');
      showRummage(nb.bodyEl);
    }
    handedOff=true;   // keep the gen alive for the next leg
    try{localStorage.setItem('dyva_inflight',JSON.stringify({id:chatId,model:model,msgs:msgs}))}catch(e){}
    setTimeout(function(){runStream(chatId,chatCreated,chatTitle,model,msgs,nb,depth+1)},0);
  }
  gen.raw=full;gen.think=think;
  var statusEl=document.createElement('div');
  statusEl.className='chat-status';
  statusEl.textContent='finding a server\u2026';
  if(bubble&&bubble.bodyEl.parentNode)bubble.bodyEl.parentNode.insertBefore(statusEl,bubble.bodyEl);
  gen.statusEl=statusEl;
  if(inView())activeStatus=statusEl;
  try{
    var resp=await fetch('api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(useTools?{model:model,messages:msgs,stream:true,tools:CHAT_TOOLS}:{model:model,messages:msgs,stream:true}),signal:ac.signal});
    host=resp.headers.get('X-Dyva-Host')||'';gen.host=host;
    fmodel=resp.headers.get('X-Dyva-Model')||model;gen.fmodel=fmodel;
    if(!resp.ok){
      clearInflight();
      var msg='HTTP '+resp.status;
      try{var j=await resp.json();msg=(j.error&&(j.error.message||j.error))||msg}catch(e){}
      if(live()){
        gen.bubble.bodyEl.classList.remove('streaming');
        gen.bubble.bodyEl.removeAttribute('data-stream');
        gen.bubble.bodyEl.innerHTML='<span class="error">Error: '+escHtml(msg)+'</span>';
      }
      if(inView())saveCurrentChat();
      renderSidebar();
      return;
    }
    if(live())setAssistantLabel(gen.bubble.roleEl,host,fmodel);
    var reader=resp.body.getReader();
    var dec=new TextDecoder();
    while(true){
      var step=await reader.read();
      if(step.done)break;
      acc+=dec.decode(step.value,{stream:true});
      var idx;
      while((idx=acc.indexOf('\n'))>=0){
        var line=acc.slice(0,idx).trim();
        acc=acc.slice(idx+1);
        if(!line)continue;
        var d;
        try{d=JSON.parse(line)}catch(e){continue}
        if(d.message&&d.message.content){
          full+=d.message.content;
          gen.raw=full;
          if(live())scheduleRender(gen);
        }
        if(d.message&&d.message.thinking){
          think+=d.message.thinking;
          gen.think=think;
          if(live())scheduleRender(gen);
        }
        if(d.message&&d.message.tool_calls){
          d.message.tool_calls.forEach(function(t){toolCalls.push(t)});
          setStatus('tool: '+(((d.message.tool_calls[0]||{}).function||{}).name||'')+'\u2026');
        }
        if(d.done){
          if(d.eval_count&&d.eval_duration)tps=Math.round(d.eval_count/(d.eval_duration/1e9)*10)/10;
          gen.tps=tps;
          await complete();
          return;
        }
      }
    }
    await complete();
  }catch(ex){
    var stopped=ac.signal.aborted;
    if(stopped||!document.hidden)clearInflight();else keepInflight();
    if(stopped){
      if(full){
        if(live()){gen.bubble.bodyEl.classList.remove('streaming');gen.bubble.bodyEl.removeAttribute('data-stream');}
        finishStream(gen.bubble,live(),host,fmodel,tps,chatId,chatCreated,chatTitle,model,think,full);
      }else if(live()){
        gen.bubble.bodyEl.classList.remove('streaming');
        gen.bubble.bodyEl.textContent='Generation stopped.';
      }
      if(inView())saveCurrentChat();
      renderSidebar();
    }else if(live()){
      gen.bubble.bodyEl.classList.remove('streaming');
      gen.bubble.bodyEl.removeAttribute('data-stream');
      var em=document.hidden?'Interrupted while in background - will resume when you return':'Error: '+escHtml(ex.message);
      gen.bubble.bodyEl.innerHTML='<span class="error">'+em+'</span>';
      if(inView())saveCurrentChat();
      renderSidebar();
    }
  }
  finally{
    if(activeStatus===statusEl)activeStatus=null;
    if(statusEl&&statusEl.parentNode)statusEl.parentNode.removeChild(statusEl);
    if(!handedOff){
      if(gens[chatId]===gen)delete gens[chatId];
      try{sessionStorage.removeItem('dyva_own')}catch(e){}
      if(inView())refreshSendButton();
    }
  }
}
// re-attach a still-running generation to a freshly-rendered bubble when its
// conversation is brought back into view
function reattachGen(id){
  var g=genOf(id);
  if(!g)return;
  var b=addMsg('assistant','');
  b.bodyEl.classList.add('streaming');
  g.bubble=b;
  var st=document.createElement('div');
  st.className='chat-status';
  st.textContent='generating\u2026';
  b.bodyEl.parentNode.insertBefore(st,b.bodyEl);
  g.statusEl=st;
  activeStatus=st;
  if(g.host)setAssistantLabel(b.roleEl,g.host,g.fmodel);
  if(g.raw||g.think)paintGen(g);else showRummage(b.bodyEl);
}
function finishStream(bubble,isLive,host,fmodel,tps,chatId,chatCreated,chatTitle,model,think,full){
  var sp=splitThink(full);
  var thAll=think+sp.t;
  if(isLive){
    setAssistantLabel(bubble.roleEl,host,fmodel,tps);
    bubble.bodyEl.classList.remove('streaming');
    bubble.bodyEl.removeAttribute('data-stream');
    bubble.bodyEl.innerHTML=thinkHtml(thAll,true)+mdRender(sp.c);
    highlightBlocks(bubble.bodyEl);
    chatLog.scrollTop=chatLog.scrollHeight;
  }
  pushAssistant(chatId,chatCreated,chatTitle,model,sp.c,host,fmodel,tps,isLive,thAll);
}
function tryResume(){
  for(var k in gens)return;
  try{if(sessionStorage.getItem('dyva_own'))return}catch(e){}
  var r=null;try{r=localStorage.getItem('dyva_inflight')}catch(e){return}
  if(!r)return;
  var j=null;try{j=JSON.parse(r)}catch(e){}
  try{localStorage.removeItem('dyva_inflight')}catch(e2){}
  if(!j||!j.model||!j.msgs||!j.msgs.length)return;
  if((j.n||0)>=2)return;
  var i=findChatIndex(j.id);
  if(i<0)return;
  currentChat=loadChats()[i];
  currentChat.messages=currentChat.messages.slice();
  renderMessages();
  renderSidebar();
  var bubble=addMsg('assistant','');
  bubble.bodyEl.classList.add('streaming');
  showRummage(bubble.bodyEl);
  setSendButton('streaming');
  runStream(String(j.id),currentChat.createdAt,currentChat.title,j.model,j.msgs,bubble);
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)setTimeout(tryResume,300)});
document.getElementById('chatSend').addEventListener('click',function(e){
  e.preventDefault();
  if(genOf(currentChat.id))stopChat();
  else sendChat();
});
document.getElementById('chatInput').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}
});

var CHAT_TOOLS=[{type:'function',function:{name:'generate_image',description:'Generate an image from a detailed text description using Stable Diffusion. Use whenever the user asks you to create, draw, render or imagine a picture.',parameters:{type:'object',properties:{prompt:{type:'string',description:'Detailed description of the image to generate'},negative_prompt:{type:'string',description:'Things to avoid in the image'}},required:['prompt']}}}];
var chatToolsBtn=document.getElementById('chatTools');
var toolsPop=document.getElementById('toolsPop');
var toolImageChk=document.getElementById('toolImage');
var toolsOn=false;
try{toolsOn=localStorage.getItem('dyva_tools')==='1'}catch(e){}
// paintTools reflects whether ANY tool is enabled, so the wrench stays lit
function paintTools(){
  chatToolsBtn.classList.toggle('active',toolsOn);
  toolImageChk.checked=toolsOn;
  chatToolsBtn.title=toolsOn?'Tools: image generation on':'Tools';
}
chatToolsBtn.addEventListener('click',function(e){
  e.stopPropagation();
  toolsPop.classList.toggle('open');
});
toolsPop.addEventListener('click',function(e){e.stopPropagation()});
toolImageChk.addEventListener('change',function(){
  toolsOn=this.checked;
  try{localStorage.setItem('dyva_tools',toolsOn?'1':'0')}catch(e){}
  paintTools();
});
document.addEventListener('click',function(){toolsPop.classList.remove('open')});
document.addEventListener('keydown',function(e){if(e.key==='Escape')toolsPop.classList.remove('open')});
paintTools();

var attachments=[];
var chatFilesInput=document.getElementById('chatFiles');
document.getElementById('chatAttach').addEventListener('click',function(e){e.preventDefault();chatFilesInput.click();});
chatFilesInput.addEventListener('change',function(){
  var files=Array.prototype.slice.call(chatFilesInput.files);
  chatFilesInput.value='';
  files.forEach(function(f){
    var r=new FileReader();
    r.onload=function(){attachments.push({name:f.name,type:f.type,size:f.size,dataUrl:r.result});renderAttachments();};
    r.readAsDataURL(f);
  });
});
function renderAttachments(){
  var row=document.getElementById('chatAttachments');
  row.innerHTML='';
  if(!attachments.length){row.style.display='none';return;}
  row.style.display='flex';
  attachments.forEach(function(a,i){
    var chip=document.createElement('div');chip.className='attach-chip';
    if(a.type&&a.type.indexOf('image/')===0){
      var im=document.createElement('img');im.src=a.dataUrl;chip.appendChild(im);
    }
    var n=document.createElement('span');n.className='name';n.textContent=a.name;chip.appendChild(n);
    var x=document.createElement('span');x.className='x';x.textContent='✕';
    x.addEventListener('click',function(){attachments.splice(i,1);renderAttachments();});
    chip.appendChild(x);
    row.appendChild(chip);
  });
}

function closeChatDrawer(){
  var sd=document.getElementById('chatSidebar');
  var bd=document.getElementById('chatBackdrop');
  if(sd)sd.classList.remove('open');
  if(bd)bd.classList.remove('open');
}
document.getElementById('chatMenuBtn').addEventListener('click',function(){
  var sd=document.getElementById('chatSidebar');
  var open=sd&&sd.classList.toggle('open');
  document.getElementById('chatBackdrop').classList.toggle('open',open);
});
document.getElementById('chatBackdrop').addEventListener('click',closeChatDrawer);

function bindSlider(id,out){
  var s=document.getElementById(id),o=document.getElementById(out);
  s.addEventListener('input',function(){o.textContent=s.value;});
}
bindSlider('imgSteps','imgStepsVal');
bindSlider('imgCfg','imgCfgVal');
bindSlider('imgBatch','imgBatchVal');
(function(){
  var d=document.getElementById('imgAdvanced');
  try{if(localStorage.getItem('dyva_imgadv')==='1')d.open=true}catch(e){}
  d.addEventListener('toggle',function(){try{localStorage.setItem('dyva_imgadv',d.open?'1':'0')}catch(e){}});
})();

async function generateImage(){
  var btn=document.getElementById('imgGenerate');
  var result=document.getElementById('imgResult');
  var seed=parseInt(document.getElementById('imgSeed').value);
  if(isNaN(seed))seed=-1;
  var body={
    model:document.getElementById('sdModel').value.trim()||undefined,
    prompt:document.getElementById('posPrompt').value.trim(),
    negative_prompt:document.getElementById('negPrompt').value.trim(),
    width:parseInt(document.getElementById('imgWidth').value)||512,
    height:parseInt(document.getElementById('imgHeight').value)||512,
    steps:parseInt(document.getElementById('imgSteps').value)||20,
    cfg_scale:parseFloat(document.getElementById('imgCfg').value)||7,
    seed:seed,
    batch_size:parseInt(document.getElementById('imgBatch').value)||1,
    sampler_name:document.getElementById('imgSampler').value,
  };
  btn.disabled=true;
  result.innerHTML='';
  var st=document.createElement('div');
  st.className='chat-status';
  st.textContent='finding a server\u2026';
  result.appendChild(st);
  activeImgStatus=st;
  try{
    var resp=await fetch('sdapi/v1/txt2img',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!resp.ok){
      var msg='HTTP '+resp.status;
      try{var j=await resp.json();msg=j.error||msg}catch(e){}
      result.innerHTML='<div class="error">Error: '+msg+'</div>';
      return;
    }
    var d=await resp.json();
    var imgs=d.images||[];
    if(!imgs.length){result.innerHTML='<div class="error">No images returned</div>';return;}
    result.innerHTML='';
    imgs.forEach(function(b64){
      var img=document.createElement('img');
      img.src='data:image/png;base64,'+b64;
      result.appendChild(img);
    });
    loadImgHistory();
  }catch(ex){result.innerHTML='<div class="error">Error: '+ex.message+'</div>';}
  finally{btn.disabled=false;if(activeImgStatus===st)activeImgStatus=null;}
}
document.getElementById('imgGenerate').addEventListener('click',generateImage);

function loadImgHistory(){
  fetch('sdapi/v1/images',{cache:'no-store'}).then(function(r){return r.json()}).then(function(list){
    var el=document.getElementById('imgHistory');
    el.innerHTML='';
    (list||[]).forEach(function(e){
      var item=document.createElement('div');
      item.className='hist-item';
      var im=document.createElement('img');
      im.src='sdapi/v1/images/'+encodeURIComponent(e.file);
      im.loading='lazy';
      var bits=[e.prompt];
      if(e.model)bits.push(e.model);
      if(e.seed!==undefined&&e.seed!==null)bits.push('seed '+e.seed);
      im.title=bits.filter(Boolean).join(' · ');
      var meta=document.createElement('div');
      meta.className='hist-meta';
      var p=document.createElement('div');
      p.className='hist-prompt';
      var txt=e.prompt||'';
      p.textContent=txt.length>100?txt.slice(0,100)+'\u2026':txt;
      var m=document.createElement('div');
      m.className='hist-model';
      m.textContent=e.model||'(model unknown)';
      var h=document.createElement('div');
      h.className='hist-host';
      h.textContent=e.host||'(host unknown)';
      meta.appendChild(p);meta.appendChild(m);meta.appendChild(h);
      var del=document.createElement('span');
      del.className='hist-del';
      del.textContent='\u2715';
      del.title='Remove from recent';
      del.addEventListener('click',function(ev){
        ev.stopPropagation();
        var x=new XMLHttpRequest();
        x.open('GET','sdapi/v1/images/delete?name='+encodeURIComponent(e.file));
        x.onload=function(){loadImgHistory()};
        x.send();
      });
      item.appendChild(im);item.appendChild(meta);item.appendChild(del);
      item.addEventListener('click',function(){openLightbox(e)});
      el.appendChild(item);
    });
    filterImgHistory();
  }).catch(function(){});
}
function filterImgHistory(){
  var q=document.getElementById('imgSearch').value.toLowerCase();
  var rows=document.querySelectorAll('#imgHistory .hist-item');
  for(var i=0;i<rows.length;i++){
    rows[i].style.display=(!q||rows[i].textContent.toLowerCase().indexOf(q)>=0)?'':'none';
  }
}
document.getElementById('imgSearch').addEventListener('input',filterImgHistory);
var lightbox=document.createElement('div');
lightbox.id='lightbox';
lightbox.innerHTML='<img alt=""><div class="cap"></div>';
document.body.appendChild(lightbox);
lightbox.addEventListener('click',function(){lightbox.classList.remove('open')});
document.addEventListener('keydown',function(e){if(e.key==='Escape')lightbox.classList.remove('open')});
function openLightboxSrc(src,cap){
  lightbox.querySelector('img').src=src;
  lightbox.querySelector('.cap').textContent=cap||'';
  lightbox.classList.add('open');
}
function openLightbox(e){
  var bits=[];
  if(e.prompt)bits.push(e.prompt);
  if(e.negative_prompt)bits.push('neg: '+e.negative_prompt);
  if(e.model)bits.push(e.model);
  if(e.sampler_name)bits.push(e.sampler_name);
  if(e.steps)bits.push(e.steps+' steps');
  if(e.cfg_scale)bits.push('cfg '+e.cfg_scale);
  if(e.width&&e.height)bits.push(e.width+'x'+e.height);
  if(e.seed!==undefined&&e.seed!==null)bits.push('seed '+e.seed);
  openLightboxSrc('sdapi/v1/images/'+encodeURIComponent(e.file),bits.join(' · '));
}
// click any image inside a chat message to view it in the same lightbox
chatLog.addEventListener('click',function(e){
  var img=e.target.closest('img');
  if(img&&img.src)openLightboxSrc(img.src,img.alt||'');
});
loadImgHistory();
['posPrompt','negPrompt'].forEach(function(id){
  document.getElementById(id).addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();generateImage();}
  });
});

function activateTab(name,chatId){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-tab')===name)});
  document.querySelectorAll('.panel').forEach(function(x){x.classList.toggle('active',x.id===name)});
  document.body.classList.toggle('chat',name==='chat');
  if(name==='chat'&&chatId)loadChatById(chatId);
}
function tabFromHash(){
  var h=location.hash.replace(/^#/,'');
  if(h.indexOf('chat/')===0)return{tab:'chat',chatId:h.slice(5)};
  if(h==='serverroom'||h==='chat'||h==='image')return{tab:h};
  return{tab:'serverroom'};
}
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){location.hash=t.getAttribute('data-tab');});
});
window.addEventListener('hashchange',function(){var h=tabFromHash();activateTab(h.tab,h.chatId);});
var init=tabFromHash();activateTab(init.tab,init.chatId);
tryResume();
