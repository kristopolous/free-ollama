[project]
name = "dyva"
version = "0.1.0"
description = "OpenAI-compatible proxy that routes to free Ollama servers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.scripts]
dyva = "dyva:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
