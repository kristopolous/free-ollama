[project]
name = "dyva"
version = "0.5.1"
description = "OpenAI-compatible proxy that routes to free Ollama servers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "curlify>=3.0.0",
    "aiohttp-swagger3>=0.10.0",
    "Pillow>=10.0.0",
    "maxminddb>=2.0.0",
    "tiktoken>=0.7.0",
]

[tool.setuptools]
include-package-data = true
packages = ["dyva", "dyva.static", "graflex"]

[tool.setuptools.package-data]
dyva = ["static/*", "*.json"]
graflex = ["*.json"]

[project.scripts]
dyva = "dyva:main"
graflex = "graflex:main"
txt2img = "txt2img:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
