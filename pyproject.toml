[project]
name = "dyva"
version = "0.2.4"
description = "OpenAI-compatible proxy that routes to free Ollama servers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
include-package-data = true
packages = ["dyva", "dyva.static", "graflex"]

[tool.setuptools.package-data]
dyva = ["static/*"]

[project.scripts]
dyva = "dyva:main"
graflex = "graflex:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
